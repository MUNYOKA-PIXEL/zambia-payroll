[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zambia-payroll-calculator"
version = "0.1.0"
description = "A compact Zambia payroll calculator with PAYE, NAPSA, NHIMA, and SDL logic"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["payroll"]
